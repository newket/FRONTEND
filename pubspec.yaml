name: newket
description: "newket"
publish_to: 'none'
version: 2.3.2+26

environment:
  sdk: '>=3.4.1 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  #  카카오
  kakao_flutter_sdk: ^2.0.0+1

  get: ^4.6.6
  dio: ^5.5.0
  flutter_dotenv: ^5.1.0
  flutter_secure_storage: ^11.0.0

  # 점선
  dotted_border: ^2.1.0

  #svg
  flutter_svg: ^2.0.10+1

  #url
  url_launcher: ^6.3.0

  # 알림 동의
  permission_handler: ^11.4.0

  # 푸시 알림
  flutter_local_notifications: ^17.2.2

  #fcm
  firebase_messaging: ^16.5.0
  googleapis_auth: ^1.6.0
  firebase_core: ^4.13.0
  firebase_analytics: ^12.4.6
  firebase_remote_config: ^6.5.6

  #splash
  flutter_native_splash: ^2.4.1

  #amplitude
  amplitude_flutter: ^4.6.2

  #shared_preferences
  shared_preferences: ^2.0.0

  #apple login
  sign_in_with_apple: ^8.1.0

  #skeleton ui
  shimmer: ^3.0.0

  #naver login
  flutter_naver_login: 2.1.1

  #google login
  google_sign_in: ^6.3.0

  # firebase web 연동
  firebase_core_web: ^3.10.0

  # cache image
  cached_network_image: 3.4.1

  # 업데이트 package
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
flutter:
  uses-material-design: true

  assets:
    - images/artist/
    - images/error/
    - images/login/
    - images/my_ticket/
    - images/mypage/
    - images/search/
    - images/splash/
    - images/tab_bar/
    - images/ticket/
    - images/ticket_detail/
    - images/update/
    - .env
    - assets/
  fonts:
    - family: Pretendard
      fonts:
        - asset: font/pretendard/Pretendard-Thin.ttf
          weight: 100
        - asset: font/pretendard/Pretendard-ExtraLight.ttf
          weight: 200
        - asset: font/pretendard/Pretendard-Light.ttf
          weight: 300
        - asset: font/pretendard/Pretendard-Regular.ttf
          weight: 400
        - asset: font/pretendard/Pretendard-Medium.ttf
          weight: 500
        - asset: font/pretendard/Pretendard-SemiBold.ttf
          weight: 600
        - asset: font/pretendard/Pretendard-Bold.ttf
          weight: 700
        - asset: font/pretendard/Pretendard-ExtraBold.ttf
          weight: 800
        - asset: font/pretendard/Pretendard-Black.ttf
          weight: 900